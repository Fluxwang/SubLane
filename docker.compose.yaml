services:
  sublane:
    image: ${SUBLANE_IMAGE:-ghcr.io/murongg/sublane:latest}
    ports:
      - "${SUBLANE_BIND_ADDRESS:-127.0.0.1}:${SUBLANE_PORT:-8080}:8080"
    environment:
      SUBLANE_ADDR: 0.0.0.0:8080
      SUBLANE_DATA_DIR: /data
      SUBLANE_DEMO: ${SUBLANE_DEMO:-false}
      SUBLANE_PUBLIC_URL: ${SUBLANE_PUBLIC_URL:-}
      SUBLANE_TRUSTED_PROXIES: ${SUBLANE_TRUSTED_PROXIES:-}
      SUBLANE_LOG_LEVEL: ${SUBLANE_LOG_LEVEL:-info}
      SUBLANE_MAX_REQUEST_BODY_MB: ${SUBLANE_MAX_REQUEST_BODY_MB:-128}
      SUBLANE_GATEWAY_CAPACITY: ${SUBLANE_GATEWAY_CAPACITY:-128}
      SUBLANE_GATEWAY_QUEUE_LIMIT: ${SUBLANE_GATEWAY_QUEUE_LIMIT:-100}
      SUBLANE_GATEWAY_QUEUE_TIMEOUT: ${SUBLANE_GATEWAY_QUEUE_TIMEOUT:-30s}
      SUBLANE_GATEWAY_REQUEST_TIMEOUT: ${SUBLANE_GATEWAY_REQUEST_TIMEOUT:-30m}
      SUBLANE_GATEWAY_STREAM_IDLE_TIMEOUT: ${SUBLANE_GATEWAY_STREAM_IDLE_TIMEOUT:-0s}
      SUBLANE_GATEWAY_KEEPALIVE_INTERVAL: ${SUBLANE_GATEWAY_KEEPALIVE_INTERVAL:-10s}
      SUBLANE_GATEWAY_RETRIES: ${SUBLANE_GATEWAY_RETRIES:-2}
      SUBLANE_GATEWAY_RETRY_DELAY: ${SUBLANE_GATEWAY_RETRY_DELAY:-500ms}
      SUBLANE_GATEWAY_TRANSIENT_THRESHOLD: ${SUBLANE_GATEWAY_TRANSIENT_THRESHOLD:-3}
      SUBLANE_GATEWAY_TRANSIENT_WINDOW: ${SUBLANE_GATEWAY_TRANSIENT_WINDOW:-2m}
      SUBLANE_GATEWAY_TRANSIENT_COOLDOWN: ${SUBLANE_GATEWAY_TRANSIENT_COOLDOWN:-10s}
      SUBLANE_GATEWAY_RATE_LIMIT_COOLDOWN: ${SUBLANE_GATEWAY_RATE_LIMIT_COOLDOWN:-5s}
      SUBLANE_INFERENCE_HEADER_TIMEOUT: ${SUBLANE_INFERENCE_HEADER_TIMEOUT:-5m}
    volumes:
      - sublane-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sublane-data:
